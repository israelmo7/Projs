; PlatformIO Project Configuration File
; SoundBoard - Dual-Microcontroller System (Stator ESP32-S3 + Rotor STM32/ATtiny)

[env]
framework = arduino

[env:stator]
board = esp32-s3-devkitc1
framework = espidf
board_build.partitions = default_16MB
upload_speed = 921600
monitor_speed = 115200
build_flags = 
    -D CONFIG_FREERTOS_HZ=1000
    -D COINTEFFER_ENABLE=1
    -D CONFIG_ESP_TASK_STACK_SIZE=8192
    -DCORE_DEBUG_LEVEL=3

[env:rotor]
board = genericSTM32F103CB
framework = arduino
board_build.variant = GENERIC_STM32F103C
board_build.f_cpu = 72000000L
upload_speed = 115200
monitor_speed = 115200
build_flags = 
    -D DEBUG_LEVEL=0
    -DCORE_DEBUG_LEVEL=3
    -D CONFIG_FREERTOS_HZ=1000
